; Waveshare ESP32-C6-LCD-1.47
;
; The C6 needs Arduino-ESP32 core 3.x, which official platformio/platform-espressif32
; does not ship -- it fails with "This board doesn't support arduino framework!".
; The pioarduino fork exists precisely for the C6/C5/H2/P4 chips. Pin a release tag
; instead of "stable" if a core bump ever breaks the build.
[platformio]
src_dir = apps

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; 4MB flash, no PSRAM on this board -- the devkitc-1 defaults assume more.
board_upload.flash_size = 4MB
board_build.flash_size = 4MB

; The default table splits 4MB into two OTA slots, leaving only ~1.31MB for the
; app -- and WiFi + TLS + ArduinoJson + Arduino_GFX alone reaches 93% of that.
; huge_app gives a single ~3MB app partition instead. Switch back to the default
; (or min_spiffs) if OTA is ever needed; nothing here uses it yet.
board_build.partitions = huge_app.csv

; Every app keeps its settings in apps/<app>/data/config.json on a LittleFS
; partition, so `pio run -e <app> -t uploadfs` needs to find the right one.
; data_dir is a [platformio] option and cannot be set per-env, so a pre-script
; sets it from the env name instead -- otherwise every uploadfs needs
; PLATFORMIO_DATA_DIR spelled out, which is easy to get wrong and would
; silently push one app's config to another. See scripts/appdata.py.
board_build.filesystem = littlefs
extra_scripts = pre:scripts/appdata.py

; Native USB CDC: without this, Serial goes to the UART pins and the USB port
; stays silent.
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

; ArduinoJson is a base dependency rather than a per-app one because lib/board/
; appcfg.h uses it, and every app reads a config.json through appcfg.h. It costs
; ~25KB of a 3MB partition even in hello, which is a fair price for one shared
; and self-checked config loader instead of four hand-rolled ones.
lib_deps =
  moononournation/GFX Library for Arduino@^1.6.7
  bblanchon/ArduinoJson@^7.0.0

; One env per app. build_src_filter is relative to src_dir (= apps/).
;
; Each app also has apps/<app>/data/config.json, pushed with `./push-config
; <app>` -- about four seconds, no rebuild. Firmware is a separate step:
;   pio run -e <app> -t upload
[env:hello]
build_src_filter = -<*> +<hello/>

; desk-clock switches orientation at runtime (BOOT button), so it needs only one
; env. Apps with a fixed layout can still use -DBOARD_LANDSCAPE and a `-h` env
; instead -- board.h supports both approaches.
[env:desk-clock]
build_src_filter = -<*> +<desk-clock/>

[env:host-monitor]
build_src_filter = -<*> +<host-monitor/>

; ticker is the one app whose config is also its DATA -- with no watchlist there
; is nothing to draw -- so a missing config.json is fatal there where every
; other app falls back to compiled defaults. Its data/ also holds 26 logos
; (~480KB) generated by tools/make-logos.py. huge_app leaves an 0xE0000 (896KB)
; data partition, which LittleFS formats on first use.
[env:ticker]
build_src_filter = -<*> +<ticker/>
