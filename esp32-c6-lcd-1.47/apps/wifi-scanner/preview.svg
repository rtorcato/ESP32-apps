<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 320" width="344" height="640" role="img" aria-label="wifi-scanner: ranked list of access points with RSSI bars, channel and encryption">
  <!-- 172x320 native. 12 rows of 24px under a 22px header. -->
  <rect width="172" height="320" fill="#0b0f14"/>

  <rect width="172" height="22" fill="#161d26"/>
  <text x="8" y="15" font-family="monospace" font-size="10" fill="#e6edf3">SCAN</text>
  <text x="164" y="15" font-family="monospace" font-size="9" fill="#8b98a5" text-anchor="end">17 APs  2.4G</text>

  <!-- Each row: SSID (truncated), RSSI bar, dBm, channel, lock if encrypted -->
  <g font-family="monospace" font-size="9">
    <text x="8" y="38" fill="#e6edf3">TORCATO-5G</text>
    <text x="164" y="38" fill="#3fb950" text-anchor="end">-41 c6</text>
    <rect x="8" y="42" width="156" height="3" fill="#263140"/><rect x="8" y="42" width="132" height="3" fill="#3fb950"/>

    <text x="8" y="62" fill="#e6edf3">TORCATO</text>
    <text x="164" y="62" fill="#3fb950" text-anchor="end">-48 c1</text>
    <rect x="8" y="66" width="156" height="3" fill="#263140"/><rect x="8" y="66" width="118" height="3" fill="#3fb950"/>

    <text x="8" y="86" fill="#e6edf3">BELL1042</text>
    <text x="164" y="86" fill="#d29922" text-anchor="end">-67 c11</text>
    <rect x="8" y="90" width="156" height="3" fill="#263140"/><rect x="8" y="90" width="78" height="3" fill="#d29922"/>

    <text x="8" y="110" fill="#e6edf3">ROGERS-2A4</text>
    <text x="164" y="110" fill="#d29922" text-anchor="end">-71 c6</text>
    <rect x="8" y="114" width="156" height="3" fill="#263140"/><rect x="8" y="114" width="66" height="3" fill="#d29922"/>

    <text x="8" y="134" fill="#e6edf3">eero-guest</text>
    <text x="164" y="134" fill="#d29922" text-anchor="end">-74 c1</text>
    <rect x="8" y="138" width="156" height="3" fill="#263140"/><rect x="8" y="138" width="58" height="3" fill="#d29922"/>

    <text x="8" y="158" fill="#8b98a5">VERY-LONG-SSI&#8230;</text>
    <text x="164" y="158" fill="#f85149" text-anchor="end">-81 c9</text>
    <rect x="8" y="162" width="156" height="3" fill="#263140"/><rect x="8" y="162" width="38" height="3" fill="#f85149"/>

    <text x="8" y="182" fill="#8b98a5">SM-A52-hotspot</text>
    <text x="164" y="182" fill="#f85149" text-anchor="end">-84 c3</text>
    <rect x="8" y="186" width="156" height="3" fill="#263140"/><rect x="8" y="186" width="30" height="3" fill="#f85149"/>

    <text x="8" y="206" fill="#8b98a5">HP-Print-4d</text>
    <text x="164" y="206" fill="#f85149" text-anchor="end">-88 c11</text>
    <rect x="8" y="210" width="156" height="3" fill="#263140"/><rect x="8" y="210" width="20" height="3" fill="#f85149"/>

    <text x="8" y="230" fill="#8b98a5">xfinitywifi</text>
    <text x="164" y="230" fill="#f85149" text-anchor="end">-90 c6</text>
    <rect x="8" y="234" width="156" height="3" fill="#263140"/><rect x="8" y="234" width="14" height="3" fill="#f85149"/>

    <text x="8" y="254" fill="#8b98a5">NETGEAR22</text>
    <text x="164" y="254" fill="#f85149" text-anchor="end">-91 c1</text>
    <rect x="8" y="258" width="156" height="3" fill="#263140"/><rect x="8" y="258" width="12" height="3" fill="#f85149"/>

    <text x="8" y="278" fill="#8b98a5">(hidden)</text>
    <text x="164" y="278" fill="#f85149" text-anchor="end">-93 c8</text>
    <rect x="8" y="282" width="156" height="3" fill="#263140"/><rect x="8" y="282" width="8" height="3" fill="#f85149"/>
  </g>

  <!-- channel congestion summary: the actual reason to build this -->
  <rect x="0" y="296" width="172" height="24" fill="#161d26"/>
  <text x="8" y="306" font-family="monospace" font-size="7" fill="#6e7681">BUSIEST</text>
  <text x="8" y="316" font-family="monospace" font-size="8" fill="#e6edf3">c6:5  c1:4  c11:3</text>
</svg>
