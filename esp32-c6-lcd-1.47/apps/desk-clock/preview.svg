<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 320" width="344" height="640" role="img" aria-label="desk-clock portrait: large time, current weather, three-day forecast, date footer">
  <!-- 172x320 portrait (env: desk-clock). Coordinates match the layout block in
       src/main.cpp exactly; textLength pins the real 6*size glyph advance. -->
  <rect width="172" height="320" fill="#000"/>

  <!-- Y_TIME 24, size 5 -> 30x40 glyphs, X_TIME 11 -->
  <text x="11" y="56" font-family="monospace" font-size="40" fill="#f8fcf8"
        textLength="150" lengthAdjust="spacing">14:32</text>
  <!-- Y_SECS 70, size 2, X_SECS 74 -->
  <text x="74" y="83" font-family="monospace" font-size="16" fill="#696969"
        textLength="24" lengthAdjust="spacing">07</text>

  <line x1="12" y1="96" x2="160" y2="96" stroke="#a9a9a9" stroke-width="1"/>

  <!-- Y_PLACE 106, size 1 -->
  <text x="8" y="113" font-family="monospace" font-size="8" fill="#808080"
        textLength="42" lengthAdjust="spacing">TORONTO</text>

  <!-- Y_TEMP 120, size 4 -> 24x32 glyphs; degree drawn as a ring -->
  <text x="8" y="146" font-family="monospace" font-size="32" fill="#00ffff"
        textLength="48" lengthAdjust="spacing">-4</text>
  <circle cx="61" cy="125" r="2" fill="none" stroke="#00ffff" stroke-width="1"/>

  <!-- Y_META 120/134/148, right-aligned to LCD_W-8 = 164 -->
  <text x="116" y="127" font-family="monospace" font-size="8" fill="#808080"
        textLength="48" lengthAdjust="spacing">feels -9</text>
  <text x="140" y="141" font-family="monospace" font-size="8" fill="#00ffff"
        textLength="24" lengthAdjust="spacing">snow</text>
  <text x="122" y="155" font-family="monospace" font-size="8" fill="#808080"
        textLength="42" lengthAdjust="spacing">78% hum</text>

  <line x1="12" y1="162" x2="160" y2="162" stroke="#a9a9a9" stroke-width="1"/>

  <!-- Forecast: X_FC0 8, FC_PITCH 52, FC_CHARS 8 (48px box), centered -->
  <g font-family="monospace" font-size="8">
    <text x="23"  y="179" fill="#808080" textLength="18" lengthAdjust="spacing">Thu</text>
    <text x="75"  y="179" fill="#808080" textLength="18" lengthAdjust="spacing">Fri</text>
    <text x="127" y="179" fill="#808080" textLength="18" lengthAdjust="spacing">Sat</text>

    <text x="17"  y="193" fill="#f8fcf8" textLength="30" lengthAdjust="spacing">-2/-8</text>
    <text x="71"  y="193" fill="#f8fcf8" textLength="24" lengthAdjust="spacing">1/-4</text>
    <text x="123" y="193" fill="#f8fcf8" textLength="24" lengthAdjust="spacing">3/-1</text>

    <text x="20"  y="207" fill="#00ffff" textLength="24" lengthAdjust="spacing">snow</text>
    <text x="66"  y="207" fill="#d3d3d3" textLength="36" lengthAdjust="spacing">cloudy</text>
    <text x="121" y="207" fill="#ffa500" textLength="30" lengthAdjust="spacing">clear</text>
  </g>

  <line x1="12" y1="216" x2="160" y2="216" stroke="#a9a9a9" stroke-width="1"/>

  <!-- Y_DATE 228, size 2, 13-char box centered -->
  <text x="26" y="241" font-family="monospace" font-size="16" fill="#f8fcf8"
        textLength="120" lengthAdjust="spacing">Wed 10 Sep</text>

  <!-- Y_STATUS 296 / Y_STALE 308, size 1 -->
  <text x="8" y="303" font-family="monospace" font-size="8" fill="#808080"
        textLength="102" lengthAdjust="spacing">TORCATO-5G -48dBm</text>
  <text x="8" y="315" font-family="monospace" font-size="8" fill="#696969"
        textLength="54" lengthAdjust="spacing">wx 4m ago</text>
</svg>
