<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 320" width="344" height="640" role="img" aria-label="zigbee-hub: paired 802.15.4 sensor cards with readings, battery and last-seen">
  <!-- 172x320 native. Sensor cards, 46px each — battery + last-seen matter as
       much as the reading, since a dead coin cell looks like a stable value. -->
  <rect width="172" height="320" fill="#0b0f14"/>

  <rect width="172" height="22" fill="#161d26"/>
  <circle cx="10" cy="11" r="4" fill="#58a6ff"/>
  <text x="20" y="15" font-family="monospace" font-size="10" fill="#e6edf3">ZIGBEE</text>
  <text x="164" y="15" font-family="monospace" font-size="9" fill="#8b98a5" text-anchor="end">4 paired</text>

  <!-- card 1 -->
  <rect x="4" y="28" width="164" height="42" rx="3" fill="#161d26"/>
  <text x="10" y="42" font-family="monospace" font-size="9" fill="#8b98a5">Living room</text>
  <text x="10" y="62" font-family="monospace" font-size="17" fill="#e6edf3">21.4&#176;C</text>
  <text x="164" y="62" font-family="monospace" font-size="9" fill="#8b98a5" text-anchor="end">44% rh</text>
  <text x="164" y="42" font-family="monospace" font-size="8" fill="#3fb950" text-anchor="end">87% &#183; 2m</text>

  <!-- card 2 -->
  <rect x="4" y="74" width="164" height="42" rx="3" fill="#161d26"/>
  <text x="10" y="88" font-family="monospace" font-size="9" fill="#8b98a5">Basement</text>
  <text x="10" y="108" font-family="monospace" font-size="17" fill="#e6edf3">17.9&#176;C</text>
  <text x="164" y="108" font-family="monospace" font-size="9" fill="#8b98a5" text-anchor="end">61% rh</text>
  <text x="164" y="88" font-family="monospace" font-size="8" fill="#d29922" text-anchor="end">31% &#183; 5m</text>

  <!-- card 3: door contact, binary -->
  <rect x="4" y="120" width="164" height="42" rx="3" fill="#161d26"/>
  <text x="10" y="134" font-family="monospace" font-size="9" fill="#8b98a5">Front door</text>
  <text x="10" y="154" font-family="monospace" font-size="17" fill="#3fb950">CLOSED</text>
  <text x="164" y="134" font-family="monospace" font-size="8" fill="#3fb950" text-anchor="end">92% &#183; 1m</text>

  <!-- card 4: stale — greyed, because a silent sensor is not a good sensor -->
  <rect x="4" y="166" width="164" height="42" rx="3" fill="#12171e"/>
  <text x="10" y="180" font-family="monospace" font-size="9" fill="#4d5560">Garage</text>
  <text x="10" y="200" font-family="monospace" font-size="17" fill="#4d5560">--.-&#176;C</text>
  <text x="164" y="180" font-family="monospace" font-size="8" fill="#f85149" text-anchor="end">? &#183; 3h</text>
  <text x="164" y="200" font-family="monospace" font-size="8" fill="#f85149" text-anchor="end">no reply</text>

  <!-- join mode: long-press BOOT. LED mirrors this state. -->
  <rect x="4" y="218" width="164" height="52" rx="3" fill="#12222e"/>
  <rect x="4" y="218" width="164" height="1" fill="#58a6ff"/>
  <text x="86" y="238" font-family="monospace" font-size="10" fill="#58a6ff" text-anchor="middle">JOIN MODE</text>
  <text x="86" y="254" font-family="monospace" font-size="9" fill="#7aa7cc" text-anchor="middle">open 84s</text>
  <text x="86" y="266" font-family="monospace" font-size="7" fill="#5c7d99" text-anchor="middle">hold BOOT to exit</text>

  <text x="8" y="290" font-family="monospace" font-size="7" fill="#6e7681">COORDINATOR &#183; ch 15 &#183; pan 0x1A2B</text>
  <text x="8" y="304" font-family="monospace" font-size="7" fill="#6e7681">no wifi (flash budget)</text>
  <text x="8" y="316" font-family="monospace" font-size="7" fill="#6e7681">net key in NVS</text>
</svg>
