<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 320" width="728" height="640" role="img" aria-label="mac-mini portrait: two auto-cycling pages, page 1 uptime CPU memory load, page 2 disk network busiest process">
  <!-- Two 172x320 panels side by side: the pages auto-cycle every 6s on one
       screen. Coordinates match the slot table in src/main.cpp; textLength pins
       the real 6*size glyph advance. -->
  <rect width="364" height="320" fill="#1a1a1a"/>

  <!-- ══ PAGE 1 ══ -->
  <g transform="translate(0,0)">
    <rect width="172" height="320" fill="#000"/>
    <!-- header: host + reachability dot, page dots top-right -->
    <circle cx="12" cy="9" r="3" fill="#3cdc64"/>
    <text x="20" y="13" font-family="monospace" font-size="8" fill="#f8fcf8"
          textLength="84" lengthAdjust="spacing">RT-Mac-Mini-M4</text>
    <circle cx="150" cy="9" r="3" fill="#f8fcf8"/>
    <circle cx="159" cy="9" r="3" fill="#5a5a5a"/>

    <!-- slot 0 y=26: UPTIME, size 3, no bar -->
    <text x="8" y="33" font-family="monospace" font-size="8" fill="#696969"
          textLength="36" lengthAdjust="spacing">UPTIME</text>
    <text x="8" y="59" font-family="monospace" font-size="24" fill="#f8fcf8"
          textLength="144" lengthAdjust="spacing">4d 22:39</text>

    <!-- slot 1 y=94: CPU, size 4, bar -->
    <text x="8" y="101" font-family="monospace" font-size="8" fill="#696969"
          textLength="18" lengthAdjust="spacing">CPU</text>
    <text x="8" y="132" font-family="monospace" font-size="32" fill="#f8fcf8"
          textLength="72" lengthAdjust="spacing">19%</text>
    <rect x="8" y="143" width="156" height="3" fill="#5a5a5a"/>
    <rect x="8" y="143" width="30" height="3" fill="#3cdc64"/>

    <!-- slot 2 y=162: MEMORY, size 4, bar (amber: 74% is past 60) -->
    <text x="8" y="169" font-family="monospace" font-size="8" fill="#696969"
          textLength="36" lengthAdjust="spacing">MEMORY</text>
    <text x="8" y="200" font-family="monospace" font-size="32" fill="#f8fcf8"
          textLength="72" lengthAdjust="spacing">74%</text>
    <rect x="8" y="211" width="156" height="3" fill="#5a5a5a"/>
    <rect x="8" y="211" width="115" height="3" fill="#ffa500"/>

    <!-- slot 3 y=230: LOAD, size 3, bar -->
    <text x="8" y="237" font-family="monospace" font-size="8" fill="#696969"
          textLength="54" lengthAdjust="spacing">LOAD 1MIN</text>
    <text x="8" y="263" font-family="monospace" font-size="24" fill="#f8fcf8"
          textLength="72" lengthAdjust="spacing">2.07</text>
    <rect x="8" y="271" width="156" height="3" fill="#5a5a5a"/>
    <rect x="8" y="271" width="32" height="3" fill="#3cdc64"/>

    <!-- footer -->
    <text x="8" y="303" font-family="monospace" font-size="8" fill="#969696"
          textLength="96" lengthAdjust="spacing">MatrixZeroIOT -58dBm</text>
    <text x="8" y="315" font-family="monospace" font-size="8" fill="#696969"
          textLength="78" lengthAdjust="spacing">polled 2s ago</text>
  </g>

  <!-- ══ PAGE 2 ══ -->
  <g transform="translate(192,0)">
    <rect width="172" height="320" fill="#000"/>
    <circle cx="12" cy="9" r="3" fill="#3cdc64"/>
    <text x="20" y="13" font-family="monospace" font-size="8" fill="#f8fcf8"
          textLength="84" lengthAdjust="spacing">RT-Mac-Mini-M4</text>
    <circle cx="150" cy="9" r="3" fill="#5a5a5a"/>
    <circle cx="159" cy="9" r="3" fill="#f8fcf8"/>

    <!-- slot 0: DISK FREE, size 3, bar -->
    <text x="8" y="33" font-family="monospace" font-size="8" fill="#696969"
          textLength="54" lengthAdjust="spacing">DISK FREE</text>
    <text x="8" y="59" font-family="monospace" font-size="24" fill="#f8fcf8"
          textLength="72" lengthAdjust="spacing">475G</text>
    <rect x="8" y="67" width="156" height="3" fill="#5a5a5a"/>
    <rect x="8" y="67" width="81" height="3" fill="#3cdc64"/>

    <!-- slot 1: DOWN, size 3 -->
    <text x="8" y="101" font-family="monospace" font-size="8" fill="#696969"
          textLength="24" lengthAdjust="spacing">DOWN</text>
    <text x="8" y="127" font-family="monospace" font-size="24" fill="#87ceeb"
          textLength="144" lengthAdjust="spacing">196 kB/s</text>

    <!-- slot 2: UP, size 3 -->
    <text x="8" y="169" font-family="monospace" font-size="8" fill="#696969"
          textLength="12" lengthAdjust="spacing">UP</text>
    <text x="8" y="195" font-family="monospace" font-size="24" fill="#ffa500"
          textLength="108" lengthAdjust="spacing">4 kB/s</text>

    <!-- slot 3: BUSIEST, size 2, bar -->
    <text x="8" y="237" font-family="monospace" font-size="8" fill="#696969"
          textLength="42" lengthAdjust="spacing">BUSIEST</text>
    <text x="8" y="257" font-family="monospace" font-size="16" fill="#f8fcf8"
          textLength="144" lengthAdjust="spacing">WindowServer</text>
    <rect x="8" y="263" width="156" height="3" fill="#5a5a5a"/>
    <rect x="8" y="263" width="64" height="3" fill="#3cdc64"/>

    <text x="8" y="303" font-family="monospace" font-size="8" fill="#969696"
          textLength="96" lengthAdjust="spacing">MatrixZeroIOT -58dBm</text>
    <text x="8" y="315" font-family="monospace" font-size="8" fill="#696969"
          textLength="78" lengthAdjust="spacing">polled 4s ago</text>
  </g>

  <text x="182" y="316" font-family="monospace" font-size="7" fill="#6e7681"
        text-anchor="middle" transform="rotate(-90 182 160)">auto-cycles every 6s</text>
</svg>
