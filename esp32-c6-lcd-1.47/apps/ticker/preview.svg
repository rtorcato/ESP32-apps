<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 320" width="344" height="640" role="img" aria-label="ticker preview: six watchlist rows at text size 2 showing symbol, price and signed percent change, with a page indicator reading 1 of 2, and a footer giving market state, data age and wifi signal">
  <!-- 172x320 native, dark scheme, portrait. This mirrors the shipped layout
       exactly: six rows of 38px pitch starting at y=30, symbol at text size 2
       on the left, price at size 2 right aligned, signed percent at size 1
       beneath it. A longer watchlist pages through six at a time, which is why
       the header carries "1/2".

       Six is the row budget, not a preference: at size 1 the glyphs are 6x8px
       and already known to be unreadable on this panel. Every measurement here
       matches the Layout struct in src/main.cpp. -->
  <rect width="172" height="320" fill="#000000"/>

  <!-- header: title, which page is showing, and the clock -->
  <text x="8" y="13" font-family="monospace" font-size="10" fill="#969696"
        textLength="54" lengthAdjust="spacing">WATCHLIST</text>
  <text x="76" y="13" font-family="monospace" font-size="10" fill="#696969"
        textLength="18" lengthAdjust="spacing">1/2</text>
  <text x="134" y="13" font-family="monospace" font-size="10" fill="#969696"
        textLength="30" lengthAdjust="spacing">09:41</text>

  <!-- row 1 -->
  <text x="8" y="43" font-family="monospace" font-size="20" fill="#f8fcf8"
        textLength="48" lengthAdjust="spacing">AAPL</text>
  <text x="104" y="43" font-family="monospace" font-size="20" fill="#3cdc64"
        textLength="60" lengthAdjust="spacing">334.4</text>
  <text x="134" y="55" font-family="monospace" font-size="10" fill="#3cdc64"
        textLength="30" lengthAdjust="spacing">+1.2%</text>

  <!-- row 2: down, so red AND a minus sign. Colour is never the only cue. -->
  <text x="8" y="81" font-family="monospace" font-size="20" fill="#f8fcf8"
        textLength="48" lengthAdjust="spacing">NVDA</text>
  <text x="104" y="81" font-family="monospace" font-size="20" fill="#ff3c3c"
        textLength="60" lengthAdjust="spacing">187.6</text>
  <text x="134" y="93" font-family="monospace" font-size="10" fill="#ff3c3c"
        textLength="30" lengthAdjust="spacing">-0.8%</text>

  <!-- row 3 -->
  <text x="8" y="119" font-family="monospace" font-size="20" fill="#f8fcf8"
        textLength="48" lengthAdjust="spacing">MSFT</text>
  <text x="104" y="119" font-family="monospace" font-size="20" fill="#3cdc64"
        textLength="60" lengthAdjust="spacing">512.8</text>
  <text x="134" y="131" font-family="monospace" font-size="10" fill="#3cdc64"
        textLength="30" lengthAdjust="spacing">+0.4%</text>

  <!-- row 4 -->
  <text x="8" y="157" font-family="monospace" font-size="20" fill="#f8fcf8"
        textLength="48" lengthAdjust="spacing">TSLA</text>
  <text x="104" y="157" font-family="monospace" font-size="20" fill="#3cdc64"
        textLength="60" lengthAdjust="spacing">421.3</text>
  <text x="134" y="169" font-family="monospace" font-size="10" fill="#3cdc64"
        textLength="30" lengthAdjust="spacing">+3.1%</text>

  <!-- row 5 -->
  <text x="8" y="195" font-family="monospace" font-size="20" fill="#f8fcf8"
        textLength="48" lengthAdjust="spacing">AMZN</text>
  <text x="104" y="195" font-family="monospace" font-size="20" fill="#ff3c3c"
        textLength="60" lengthAdjust="spacing">245.1</text>
  <text x="134" y="207" font-family="monospace" font-size="10" fill="#ff3c3c"
        textLength="30" lengthAdjust="spacing">-1.5%</text>

  <!-- row 6: a 5 character symbol, the widest the box allows -->
  <text x="8" y="233" font-family="monospace" font-size="20" fill="#f8fcf8"
        textLength="60" lengthAdjust="spacing">GOOGL</text>
  <text x="104" y="233" font-family="monospace" font-size="20" fill="#3cdc64"
        textLength="60" lengthAdjust="spacing">198.7</text>
  <text x="134" y="245" font-family="monospace" font-size="10" fill="#3cdc64"
        textLength="30" lengthAdjust="spacing">+0.6%</text>

  <!-- footer. "delayed" is stated rather than implied: Yahoo runs behind on
       some exchanges, and a panel that looks live when it is not is worse
       than one that admits the lag. -->
  <text x="8" y="271" font-family="monospace" font-size="10" fill="#3cdc64"
        textLength="66" lengthAdjust="spacing">market open</text>
  <text x="8" y="286" font-family="monospace" font-size="10" fill="#696969"
        textLength="90" lengthAdjust="spacing">delayed, 3m ago</text>
  <text x="8" y="301" font-family="monospace" font-size="10" fill="#969696"
        textLength="96" lengthAdjust="spacing">MatrixZer -60dBm</text>
</svg>
