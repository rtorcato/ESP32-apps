<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 320" width="344" height="640" role="img" aria-label="mac-mini: uptime, load, memory, disk and network stats with a sleep/wake button state">
  <!-- 172x320 native. Page 1 of 4 (short press cycles). -->
  <rect width="172" height="320" fill="#0b0f14"/>

  <!-- header: host + reachability dot -->
  <rect width="172" height="22" fill="#161d26"/>
  <circle cx="10" cy="11" r="4" fill="#3fb950"/>
  <text x="20" y="15" font-family="monospace" font-size="10" fill="#e6edf3">mac-mini</text>
  <text x="164" y="15" font-family="monospace" font-size="8" fill="#8b98a5" text-anchor="end">1/4</text>

  <!-- uptime, the headline number -->
  <text x="8" y="40" font-family="monospace" font-size="8" fill="#6e7681">UPTIME</text>
  <text x="8" y="62" font-family="monospace" font-size="19" fill="#e6edf3">14d 06:22</text>

  <line x1="0" y1="76" x2="172" y2="76" stroke="#263140"/>

  <!-- load average -->
  <text x="8" y="90" font-family="monospace" font-size="8" fill="#6e7681">LOAD 1/5/15</text>
  <text x="8" y="104" font-family="monospace" font-size="11" fill="#e6edf3">1.82 1.44 1.10</text>
  <rect x="8" y="110" width="156" height="4" rx="2" fill="#263140"/>
  <rect x="8" y="110" width="71" height="4" rx="2" fill="#3fb950"/>

  <!-- memory pressure (not "free" — pressure is the real number on macOS) -->
  <text x="8" y="132" font-family="monospace" font-size="8" fill="#6e7681">MEM PRESSURE</text>
  <text x="164" y="132" font-family="monospace" font-size="8" fill="#d29922" text-anchor="end">42%</text>
  <rect x="8" y="137" width="156" height="4" rx="2" fill="#263140"/>
  <rect x="8" y="137" width="66" height="4" rx="2" fill="#d29922"/>

  <!-- disk -->
  <text x="8" y="159" font-family="monospace" font-size="8" fill="#6e7681">DISK  /</text>
  <text x="164" y="159" font-family="monospace" font-size="8" fill="#8b98a5" text-anchor="end">318G free</text>
  <rect x="8" y="164" width="156" height="4" rx="2" fill="#263140"/>
  <rect x="8" y="164" width="98" height="4" rx="2" fill="#58a6ff"/>

  <!-- network throughput -->
  <line x1="0" y1="182" x2="172" y2="182" stroke="#263140"/>
  <text x="8" y="196" font-family="monospace" font-size="8" fill="#6e7681">NET</text>
  <text x="8" y="212" font-family="monospace" font-size="11" fill="#3fb950">&#8595; 12.4 MB/s</text>
  <text x="8" y="228" font-family="monospace" font-size="11" fill="#58a6ff">&#8593;  0.8 MB/s</text>

  <!-- cpu temp + top process -->
  <line x1="0" y1="240" x2="172" y2="240" stroke="#263140"/>
  <text x="8" y="254" font-family="monospace" font-size="8" fill="#6e7681">CPU</text>
  <text x="164" y="254" font-family="monospace" font-size="8" fill="#e6edf3" text-anchor="end">51&#176;C  23%</text>
  <text x="8" y="270" font-family="monospace" font-size="8" fill="#6e7681">TOP</text>
  <text x="164" y="270" font-family="monospace" font-size="8" fill="#e6edf3" text-anchor="end">Xcode 118%</text>

  <!-- button state: armed, awaiting confirm. never one-press. -->
  <rect x="0" y="282" width="172" height="38" fill="#3d1d1d"/>
  <rect x="0" y="282" width="172" height="1" fill="#f85149"/>
  <text x="86" y="298" font-family="monospace" font-size="10" fill="#f85149" text-anchor="middle">SLEEP? press 3s</text>
  <text x="86" y="312" font-family="monospace" font-size="8" fill="#a86464" text-anchor="middle">release to cancel</text>
</svg>
