<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="360" height="480" role="img" aria-label="sd-file-browser: paged file list with sizes and page-up/down buttons">
  <!-- 240x320 native. Paged, not scrolled — resistive touch is bad at flicks,
       and paging means only one screenful of entries is ever held in RAM. -->
  <rect width="240" height="320" fill="#0b0f14"/>

  <!-- breadcrumb -->
  <rect width="240" height="24" fill="#161d26"/>
  <text x="8" y="17" font-family="monospace" font-size="10" fill="#e6edf3">/DCIM/100APPLE</text>
  <text x="232" y="17" font-family="monospace" font-size="9" fill="#8b98a5" text-anchor="end">240 items</text>

  <g font-family="monospace" font-size="10">
    <!-- parent dir -->
    <rect x="0" y="28" width="240" height="26" fill="#12171e"/>
    <text x="8" y="45" fill="#58a6ff">..</text>

    <text x="8" y="71" fill="#58a6ff">IMG_2481.JPG</text><text x="232" y="71" fill="#6e7681" text-anchor="end">2.4M</text>
    <line x1="0" y1="80" x2="240" y2="80" stroke="#1b232d"/>

    <text x="8" y="97" fill="#58a6ff">IMG_2482.JPG</text><text x="232" y="97" fill="#6e7681" text-anchor="end">2.1M</text>
    <line x1="0" y1="106" x2="240" y2="106" stroke="#1b232d"/>

    <!-- selected row -->
    <rect x="0" y="110" width="240" height="26" fill="#1c2a3a"/>
    <text x="8" y="127" fill="#e6edf3">NOTES.TXT</text><text x="232" y="127" fill="#8b98a5" text-anchor="end">14K</text>

    <text x="8" y="153" fill="#8b98a5">CONFIG.JSON</text><text x="232" y="153" fill="#6e7681" text-anchor="end">1.2K</text>
    <line x1="0" y1="162" x2="240" y2="162" stroke="#1b232d"/>

    <!-- truncated long name -->
    <text x="8" y="179" fill="#8b98a5">VERY-LONG-FILENA&#8230;</text><text x="232" y="179" fill="#6e7681" text-anchor="end">8.0M</text>
    <line x1="0" y1="188" x2="240" y2="188" stroke="#1b232d"/>

    <text x="8" y="205" fill="#d29922">FIRMWARE.BIN</text><text x="232" y="205" fill="#6e7681" text-anchor="end">1.8M</text>
    <line x1="0" y1="214" x2="240" y2="214" stroke="#1b232d"/>

    <text x="8" y="231" fill="#8b98a5">LOG.CSV</text><text x="232" y="231" fill="#6e7681" text-anchor="end">2.0M</text>
    <line x1="0" y1="240" x2="240" y2="240" stroke="#1b232d"/>

    <!-- oversized text file: viewer must cap the read, not open it whole -->
    <text x="8" y="257" fill="#f85149">DUMP.TXT</text><text x="232" y="257" fill="#f85149" text-anchor="end">210M</text>
  </g>

  <!-- paging controls, not kinetic scroll -->
  <rect x="6" y="270" width="72" height="42" rx="5" fill="#1c2430"/>
  <text x="42" y="296" font-family="monospace" font-size="14" fill="#e6edf3" text-anchor="middle">&#8593;</text>
  <rect x="84" y="270" width="72" height="42" rx="5" fill="#1c2430"/>
  <text x="120" y="296" font-family="monospace" font-size="11" fill="#e6edf3" text-anchor="middle">OPEN</text>
  <rect x="162" y="270" width="72" height="42" rx="5" fill="#1c2430"/>
  <text x="198" y="296" font-family="monospace" font-size="14" fill="#e6edf3" text-anchor="middle">&#8595;</text>

  <text x="120" y="318" font-family="monospace" font-size="7" fill="#6e7681" text-anchor="middle">page 1/24 &#183; dir paged, not buffered</text>
</svg>
