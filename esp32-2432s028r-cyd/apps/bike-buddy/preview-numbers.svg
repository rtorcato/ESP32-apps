<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="360" height="480" role="img" aria-label="bike-buddy NUMBERS page: large speed with average and max, over a 2x3 grid of heart rate, cadence, power, ascent, grade and lean angle">
  <!-- 240x320 native. NUMBERS page, 3 of 5.
       Six cells is the budget. More cells means smaller type, and nothing here
       is worth squinting at mid-trail - the six that earned their place are the
       ones not already in the persistent footer.
       LEAN comes from atan(v*yaw_rate/g), not from the accelerometer: a bike
       leans until lateral g reads ~0, so a car-style g-meter would sit dead
       still through the best corner of the ride. -->
  <rect width="240" height="320" fill="#0b0f14"/>

  <!-- header -->
  <rect width="240" height="26" fill="#161d26"/>
  <text x="8" y="18" font-family="monospace" font-size="11" fill="#e6edf3">NUMBERS</text>
  <circle cx="104" cy="13" r="2.5" fill="#2d353f"/>
  <circle cx="114" cy="13" r="2.5" fill="#2d353f"/>
  <circle cx="124" cy="13" r="2.5" fill="#e6edf3"/>
  <circle cx="134" cy="13" r="2.5" fill="#2d353f"/>
  <circle cx="144" cy="13" r="2.5" fill="#2d353f"/>
  <text x="232" y="18" font-family="monospace" font-size="9" fill="#8b98a5" text-anchor="end">SAT 9  14:32</text>

  <!-- speed gets its own band: the one number read at speed -->
  <text x="10" y="82" font-family="monospace" font-size="46" fill="#e6edf3">18.4</text>
  <text x="124" y="82" font-family="monospace" font-size="12" fill="#8b98a5">km/h</text>
  <text x="232" y="58" font-family="monospace" font-size="9" fill="#8b98a5" text-anchor="end">AVG 14.2</text>
  <text x="232" y="76" font-family="monospace" font-size="9" fill="#8b98a5" text-anchor="end">MAX 41.7</text>

  <!-- row 1 -->
  <rect x="6" y="104" width="110" height="56" rx="4" fill="#161d26"/>
  <text x="14" y="120" font-family="monospace" font-size="8" fill="#8b98a5">HEART</text>
  <text x="14" y="148" font-family="monospace" font-size="20" fill="#f85149">148</text>
  <text x="54" y="148" font-family="monospace" font-size="9" fill="#6e7681">bpm</text>

  <rect x="124" y="104" width="110" height="56" rx="4" fill="#161d26"/>
  <text x="132" y="120" font-family="monospace" font-size="8" fill="#8b98a5">CADENCE</text>
  <text x="132" y="148" font-family="monospace" font-size="20" fill="#e6edf3">82</text>
  <text x="160" y="148" font-family="monospace" font-size="9" fill="#6e7681">rpm</text>

  <!-- row 2 -->
  <rect x="6" y="166" width="110" height="56" rx="4" fill="#161d26"/>
  <text x="14" y="182" font-family="monospace" font-size="8" fill="#8b98a5">POWER</text>
  <text x="14" y="210" font-family="monospace" font-size="20" fill="#e6edf3">214</text>
  <text x="54" y="210" font-family="monospace" font-size="9" fill="#6e7681">W</text>

  <!-- ascent is barometric, not GPS: GPS altitude wanders 10-20m standing still -->
  <rect x="124" y="166" width="110" height="56" rx="4" fill="#161d26"/>
  <text x="132" y="182" font-family="monospace" font-size="8" fill="#8b98a5">ASCENT</text>
  <text x="132" y="210" font-family="monospace" font-size="20" fill="#e6edf3">+486</text>
  <text x="184" y="210" font-family="monospace" font-size="9" fill="#6e7681">m</text>

  <!-- row 3 -->
  <rect x="6" y="228" width="110" height="56" rx="4" fill="#161d26"/>
  <text x="14" y="244" font-family="monospace" font-size="8" fill="#8b98a5">GRADE</text>
  <text x="14" y="272" font-family="monospace" font-size="20" fill="#d29922">7.2</text>
  <text x="54" y="272" font-family="monospace" font-size="9" fill="#6e7681">%</text>

  <rect x="124" y="228" width="110" height="56" rx="4" fill="#161d26"/>
  <text x="132" y="244" font-family="monospace" font-size="8" fill="#8b98a5">LEAN</text>
  <text x="132" y="272" font-family="monospace" font-size="20" fill="#58a6ff">31</text>
  <text x="160" y="272" font-family="monospace" font-size="9" fill="#6e7681">&#176;</text>

  <!-- footer: identical on all five pages -->
  <rect x="0" y="288" width="240" height="32" fill="#161d26"/>
  <text x="8" y="311" font-family="monospace" font-size="17" fill="#e6edf3">18.4</text>
  <text x="52" y="311" font-family="monospace" font-size="8" fill="#6e7681">km/h</text>
  <text x="112" y="311" font-family="monospace" font-size="11" fill="#8b98a5">12.4 km</text>
  <text x="232" y="311" font-family="monospace" font-size="11" fill="#8b98a5" text-anchor="end">1:04:37</text>
</svg>
