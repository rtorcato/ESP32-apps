<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="360" height="480" role="img" aria-label="bike-buddy MAP page: hillshade terrain with trails coloured by difficulty, planned route, ridden track and position">
  <!-- 240x320 native. MAP page, 1 of 5. Header and footer are the same on every
       page: dots for where you are, and the three numbers you never want to go
       looking for.
       The base is HILLSHADE, not street tiles. Relief reads as terrain shape
       even this small, where contours every 10m would be grey mush - so only
       index contours are drawn, and trails are coloured by OSM mtb:scale.
       All of it rendered locally for 240px, because you cannot restyle
       somebody else's PNG. -->
  <rect width="240" height="320" fill="#0b0f14"/>

  <defs>
    <clipPath id="map"><rect x="6" y="30" width="228" height="254" rx="4"/></clipPath>
  </defs>

  <!-- header -->
  <rect width="240" height="26" fill="#161d26"/>
  <text x="8" y="18" font-family="monospace" font-size="11" fill="#e6edf3">MAP</text>
  <circle cx="104" cy="13" r="2.5" fill="#e6edf3"/>
  <circle cx="114" cy="13" r="2.5" fill="#2d353f"/>
  <circle cx="124" cy="13" r="2.5" fill="#2d353f"/>
  <circle cx="134" cy="13" r="2.5" fill="#2d353f"/>
  <circle cx="144" cy="13" r="2.5" fill="#2d353f"/>
  <text x="232" y="18" font-family="monospace" font-size="9" fill="#8b98a5" text-anchor="end">SAT 9  14:32</text>

  <rect x="6" y="30" width="228" height="254" rx="4" fill="#10161e"/>
  <g clip-path="url(#map)">
    <!-- hillshade: the ridge and the gully, without drawing a single line -->
    <path d="M6 96 Q 60 62, 112 88 T 234 72 L 234 30 L 6 30 Z" fill="#161f29"/>
    <ellipse cx="66" cy="172" rx="72" ry="46" fill="#151d26"/>
    <ellipse cx="184" cy="224" rx="62" ry="44" fill="#171f2a"/>
    <path d="M6 244 Q 82 212, 142 252 T 234 242 L 234 284 L 6 284 Z" fill="#131a23"/>

    <!-- index contours only, every 50m -->
    <path d="M18 124 Q 70 98, 122 120 T 228 106" fill="none" stroke="#22303f" stroke-width="0.8"/>
    <path d="M14 152 Q 72 128, 126 150 T 230 138" fill="none" stroke="#2f4256" stroke-width="1.4"/>
    <path d="M12 184 Q 74 162, 130 182 T 232 172" fill="none" stroke="#22303f" stroke-width="0.8"/>
    <text x="18" y="149" font-family="monospace" font-size="6" fill="#3d5266">480</text>

    <!-- trails, coloured by mtb:scale. Four trails beats forty roads. -->
    <path d="M14 264 C 50 252, 62 230, 96 224 S 150 216, 176 198"
          fill="none" stroke="#3fb950" stroke-width="1.5"/>
    <path d="M96 224 C 118 198, 112 170, 140 152 S 190 132, 214 114"
          fill="none" stroke="#58a6ff" stroke-width="1.5"/>
    <path d="M140 152 C 152 130, 146 110, 168 94"
          fill="none" stroke="#f85149" stroke-width="1.5"/>

    <!-- planned route: dashed, so it reads as "not yet" against the solid track -->
    <path d="M20 268 C 54 254, 66 232, 100 226 S 152 218, 178 200 S 206 152, 214 118"
          fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="6 3" stroke-linecap="round"/>
    <!-- where you've actually been -->
    <path d="M20 268 C 54 254, 66 232, 100 226 S 140 221, 158 212"
          fill="none" stroke="#e6edf3" stroke-width="2" stroke-linecap="round"/>
    <!-- position and heading. A triangle, not a dot: at a junction the thing you
         need is which way you point. -->
    <polygon points="0,-7 5,6 0,3 -5,6" fill="#e6edf3" stroke="#0b0f14" stroke-width="0.5"
             transform="translate(158,212) rotate(38)"/>

    <!-- scale bar -->
    <line x1="14" y1="276" x2="54" y2="276" stroke="#6e7681" stroke-width="1"/>
    <line x1="14" y1="273" x2="14" y2="276" stroke="#6e7681" stroke-width="1"/>
    <line x1="54" y1="273" x2="54" y2="276" stroke="#6e7681" stroke-width="1"/>
    <text x="58" y="279" font-family="monospace" font-size="7" fill="#6e7681">200 m</text>

    <!-- difficulty legend -->
    <line x1="160" y1="276" x2="170" y2="276" stroke="#3fb950" stroke-width="1.5"/>
    <line x1="182" y1="276" x2="192" y2="276" stroke="#58a6ff" stroke-width="1.5"/>
    <line x1="204" y1="276" x2="214" y2="276" stroke="#f85149" stroke-width="1.5"/>
    <text x="172" y="279" font-family="monospace" font-size="6" fill="#6e7681">S1</text>
    <text x="194" y="279" font-family="monospace" font-size="6" fill="#6e7681">S2</text>
    <text x="216" y="279" font-family="monospace" font-size="6" fill="#6e7681">S3</text>
  </g>
  <text x="228" y="42" font-family="monospace" font-size="7" fill="#4d5560" text-anchor="end">z16 hillshade</text>

  <!-- footer: identical on all five pages -->
  <rect x="0" y="288" width="240" height="32" fill="#161d26"/>
  <text x="8" y="311" font-family="monospace" font-size="17" fill="#e6edf3">18.4</text>
  <text x="52" y="311" font-family="monospace" font-size="8" fill="#6e7681">km/h</text>
  <text x="112" y="311" font-family="monospace" font-size="11" fill="#8b98a5">12.4 km</text>
  <text x="232" y="311" font-family="monospace" font-size="11" fill="#8b98a5" text-anchor="end">1:04:37</text>
</svg>
