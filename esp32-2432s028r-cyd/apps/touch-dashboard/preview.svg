<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="360" height="480" role="img" aria-label="touch-dashboard: 2x3 grid of smart-home tiles with state, plus a status strip">
  <!-- 240x320 native. 2x3 grid of 112x76 tiles: big targets for resistive touch. -->
  <rect width="240" height="320" fill="#0b0f14"/>

  <!-- header -->
  <rect width="240" height="26" fill="#161d26"/>
  <text x="8" y="18" font-family="monospace" font-size="11" fill="#e6edf3">HOME</text>
  <text x="232" y="18" font-family="monospace" font-size="10" fill="#8b98a5" text-anchor="end">14:32  21&#176;C</text>

  <!-- row 1 -->
  <rect x="8" y="34" width="112" height="76" rx="5" fill="#2d2a12"/>
  <rect x="8" y="34" width="112" height="3" rx="1.5" fill="#d29922"/>
  <text x="18" y="58" font-family="monospace" font-size="10" fill="#d29922">Living rm</text>
  <text x="18" y="82" font-family="monospace" font-size="15" fill="#e6edf3">ON</text>
  <text x="18" y="100" font-family="monospace" font-size="9" fill="#8b98a5">72% warm</text>

  <rect x="128" y="34" width="104" height="76" rx="5" fill="#161d26"/>
  <text x="138" y="58" font-family="monospace" font-size="10" fill="#8b98a5">Kitchen</text>
  <text x="138" y="82" font-family="monospace" font-size="15" fill="#4d5560">OFF</text>

  <!-- row 2 -->
  <rect x="8" y="118" width="112" height="76" rx="5" fill="#161d26"/>
  <text x="18" y="142" font-family="monospace" font-size="10" fill="#8b98a5">Office</text>
  <text x="18" y="166" font-family="monospace" font-size="15" fill="#4d5560">OFF</text>

  <!-- pending: tapped, awaiting confirmation from the broker -->
  <rect x="128" y="118" width="104" height="76" rx="5" fill="#12222e"/>
  <rect x="128" y="118" width="104" height="3" rx="1.5" fill="#58a6ff"/>
  <text x="138" y="142" font-family="monospace" font-size="10" fill="#58a6ff">Bedroom</text>
  <text x="138" y="166" font-family="monospace" font-size="15" fill="#58a6ff">&#8230;</text>
  <text x="138" y="184" font-family="monospace" font-size="8" fill="#5c7d99">sending</text>

  <!-- row 3: scene + thermostat -->
  <rect x="8" y="202" width="112" height="76" rx="5" fill="#161d26"/>
  <text x="18" y="226" font-family="monospace" font-size="10" fill="#8b98a5">Scene</text>
  <text x="18" y="250" font-family="monospace" font-size="13" fill="#e6edf3">Evening</text>
  <text x="18" y="268" font-family="monospace" font-size="9" fill="#6e7681">tap to run</text>

  <rect x="128" y="202" width="104" height="76" rx="5" fill="#161d26"/>
  <text x="138" y="226" font-family="monospace" font-size="10" fill="#8b98a5">Heat</text>
  <text x="138" y="252" font-family="monospace" font-size="18" fill="#e6edf3">20&#176;</text>
  <text x="138" y="270" font-family="monospace" font-size="9" fill="#6e7681">now 21&#176;</text>

  <!-- status strip: push-based sync + touch calibration reminder -->
  <rect x="0" y="292" width="240" height="28" fill="#161d26"/>
  <circle cx="12" cy="306" r="4" fill="#3fb950"/>
  <text x="24" y="310" font-family="monospace" font-size="8" fill="#8b98a5">mqtt subscribed &#183; 14 entities</text>
  <text x="232" y="310" font-family="monospace" font-size="8" fill="#6e7681" text-anchor="end">cal &#10003;</text>
</svg>
