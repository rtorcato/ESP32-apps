<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="360" height="480" role="img" aria-label="ticker SEARCH: a query box and a 6x5 keyboard of 40px keys, A to X then Y Z . - backspace GO">
  <!-- 240x320 native, drawn from the firmware's layout constants (2026-09-16).
       Swipe left from the list. Symbols are short and upper-case, so the keys can be
       finger-sized. GO asks Yahoo's keyless lookup; tapping a result adds the symbol
       to the list and opens its page.
  -->
  <rect width="240" height="320" fill="#000000"/>
  <text x="8" y="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9aa4ae" text-anchor="start">SEARCH</text>
  <text x="232" y="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5c6670" text-anchor="end">v list</text>
  <rect x="8" y="44" width="224" height="40" rx="8" fill="#20242a"/>
  <text x="20" y="73" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#e6edf3" text-anchor="start">MIC</text>
  <text x="8" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5c6670" text-anchor="start">type a few letters, tap GO</text>
  <rect x="2" y="122" width="36" height="36" rx="6" fill="none" stroke="#20242a"/>
  <text x="20" y="147" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#e6edf3" text-anchor="middle">A</text>
