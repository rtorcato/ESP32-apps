  <rect x="118" y="172" width="11" height="7" rx="0" fill="#f0473c"/>
  <line x1="145.5" y1="152" x2="145.5" y2="181" stroke="#22d05a" stroke-width="1"/>
  <rect x="140" y="158" width="11" height="21" rx="0" fill="#22d05a"/>
