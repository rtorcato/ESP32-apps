<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="360" height="480" role="img" aria-label="ticker boot splash: a navy-to-black sky, nine candles on the way up with a gold average, the wordmark, a status line">
  <!-- 240x320 native, drawn from the firmware's layout constants (2026-09-16).
       Drawn from primitives on the device, so there is no asset to push. A wake from
       deep sleep skips it and shows the restored list at once.
  -->
  <rect width="240" height="320" fill="#000000"/>
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000a1e"/><stop offset="1" stop-color="#000000"/></linearGradient></defs>
  <rect x="0" y="0" width="240" height="320" rx="0" fill="url(#sky)"/>
  <line x1="35.5" y1="192" x2="35.5" y2="212" stroke="#22d05a" stroke-width="1"/>
  <rect x="30" y="196" width="11" height="11" rx="0" fill="#22d05a"/>
