<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="360" height="480" role="img" aria-label="ticker DETAIL: 96px logo, symbol, name, price and change, intraday chart with high, low and previous close, five range chips, day and 52-week range bars, gesture hint">
  <!-- 240x320 native, drawn from the firmware's layout constants (2026-09-16).
       No buttons: swipe left/right for the next/previous stock, up for headlines,
       down for the list; a long press arms removal. Outside the regular session the
       price shown is the newest extended-hours bar and the name line says so.
  -->
