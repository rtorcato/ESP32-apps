<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="360" height="480" role="img" aria-label="ticker LIST: a scrolling ring of seven rows, each a logo badge, symbol, intraday sparkline, price and signed percent">
  <!-- 240x320 native, drawn from the firmware's layout constants (2026-09-16).
       The list scrolls continuously (ILI9341 hardware scroll) and wraps, so the top
       row is cut mid-transit here and an eighth is entering at the bottom. No pages,
       no footer: the header says only CLOSED (and when it opens) when that is so.
       Badges are 24px, cropped to the mark on the host. A finger drags the list,
       a still finger opens the stock on lift, swipe right is settings, left is search.
  -->
  <rect width="240" height="320" fill="#000000"/>
  <text x="6" y="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#9aa4ae" text-anchor="start">WATCHLIST</text>
