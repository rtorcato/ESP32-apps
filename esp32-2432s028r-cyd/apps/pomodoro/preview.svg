<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="360" height="480" role="img" aria-label="pomodoro: large countdown, progress ring, touch controls and session dots">
  <!-- 240x320 native. Countdown owns the middle; controls are chunky for resistive touch. -->
  <rect width="240" height="320" fill="#0b0f14"/>

  <rect width="240" height="26" fill="#2d1416"/>
  <text x="120" y="18" font-family="monospace" font-size="11" fill="#f85149" text-anchor="middle">FOCUS</text>

  <!-- progress ring: r=68, circumference ~427; 38% elapsed -->
  <circle cx="120" cy="128" r="68" fill="none" stroke="#263140" stroke-width="8"/>
  <circle cx="120" cy="128" r="68" fill="none" stroke="#f85149" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="427" stroke-dashoffset="265"
          transform="rotate(-90 120 128)"/>

  <text x="120" y="136" font-family="monospace" font-size="40" fill="#e6edf3" text-anchor="middle">15:24</text>
  <text x="120" y="158" font-family="monospace" font-size="9" fill="#6e7681" text-anchor="middle">of 25:00</text>

  <!-- session dots: 4 done, 5th in progress -->
  <g>
    <circle cx="84" cy="212" r="6" fill="#f85149"/>
    <circle cx="106" cy="212" r="6" fill="#f85149"/>
    <circle cx="128" cy="212" r="6" fill="#f85149"/>
    <circle cx="150" cy="212" r="6" fill="#f85149"/>
    <circle cx="172" cy="212" r="6" fill="none" stroke="#f85149" stroke-width="2"/>
  </g>
  <text x="120" y="236" font-family="monospace" font-size="9" fill="#6e7681" text-anchor="middle">4 done today</text>

  <!-- controls: 2 buttons, ~104x44 — far bigger than a fingertip needs, on purpose -->
  <rect x="12" y="252" width="104" height="44" rx="6" fill="#1c2430"/>
  <text x="64" y="279" font-family="monospace" font-size="13" fill="#e6edf3" text-anchor="middle">PAUSE</text>

  <rect x="124" y="252" width="104" height="44" rx="6" fill="#1c2430"/>
  <text x="176" y="279" font-family="monospace" font-size="13" fill="#e6edf3" text-anchor="middle">SKIP</text>

  <text x="120" y="312" font-family="monospace" font-size="8" fill="#6e7681" text-anchor="middle">long-press either = reset</text>
</svg>
