; DIYmalls ESP32-2432S028R -- the 2.8" "Cheap Yellow Display". Classic
; ESP32-D0WD-V3 (esptool, 2026-09-15), 4MB flash, no PSRAM, CH340 UART bridge
; on the USB port (/dev/cu.usbserial-*). ILI9341 240x320 over SPI, XPT2046
; resistive touch, microSD, RGB LED, LDR, speaker header.
;
; Same pioarduino fork as the other two boards so all three build on one
; Arduino core. The classic ESP32 would also build on the official platform.
[platformio]
src_dir = apps

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; The rotary's native USB shows up as usbmodem; this board's CH340 as
; usbserial. Pinned so `pio run -t upload` never flashes the wrong board when
; both are plugged in. (A glob here is passed to esptool literally.) The
; number is the hub port -- change it if the board moves.
upload_port = /dev/cu.usbserial-21230
monitor_port = /dev/cu.usbserial-21230

; 4MB flash, same squeeze as the C6: the default table leaves ~1.3MB for the
; app and Wi-Fi + TLS + GFX blows through that. One ~3MB slot, no OTA.
board_build.partitions = huge_app.csv

; No USB CDC flags: Serial is the real UART0 behind the CH340.

; ponytail: config loader, data-dir hook and push-config are the C6 project's,
; reached by symlink / relative path. Hoist when it hurts.
board_build.filesystem = littlefs
extra_scripts = pre:../esp32-c6-lcd-1.47/scripts/appdata.py

lib_deps =
  moononournation/GFX Library for Arduino@^1.6.7
  bblanchon/ArduinoJson@^7.0.0

; One env per app. build_src_filter is relative to src_dir (= apps/).
;   pio run -e hello -t upload -t monitor
;   ./push-config hello        # config.json only, no rebuild
[env:hello]
build_src_filter = -<*> +<hello/>

[env:ticker]
build_src_filter = -<*> +<ticker/>
