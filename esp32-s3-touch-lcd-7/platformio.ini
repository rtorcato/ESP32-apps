; Waveshare ESP32-S3-Touch-LCD-7 -- 7" 800x480 ST7262 over 16-bit RGB parallel,
; GT911 capacitive touch, CH422G I/O expander for backlight and the two resets.
; Module is an ESP32-S3-WROOM-1 N16R8 (esptool 2026-09-16: 16MB flash,
; "Embedded PSRAM 8MB (AP_3v3)"), the same as the Elecrow rotary, so the same
; board manifest: it sets memory_type = qio_opi and BOARD_HAS_PSRAM, which the
; 768KB framebuffer needs.
;
; Pinout from Espressif's ESP32_Display_Panel board file for this device and
; the ESPHome package for it, which agree on every GPIO. Native USB shows up
; as usbmodem.
[platformio]
src_dir = apps

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; default_16MB.csv: two 6.5MB OTA app slots and a 3.4MB data partition. Room
; for 128px logos (32KB each) many times over.
board_build.filesystem = littlefs
; factory (Home) + ota_0 (the loaded app) + 11MB littlefs. Every env
; must build against the same table or NVS and LittleFS move under each
; other. See partitions.csv and apps/home/README.md.
board_build.partitions = partitions.csv

; ponytail: config loader, data-dir hook, push-config and the fonts are the
; other boards', reached by symlink / relative path. Hoist when it hurts.
extra_scripts = pre:../esp32-c6-lcd-1.47/scripts/appdata.py

; The USB-C goes through a UART bridge, not the S3's native USB: with the CDC
; flags the app's Serial went to the native port and the monitor saw only the
; ROM's boot lines. No flags: Serial is UART0, which is what the bridge carries.
build_flags =

lib_deps =
  moononournation/GFX Library for Arduino@^1.6.7
  bblanchon/ArduinoJson@^7.0.0
  bitbank2/JPEGDEC@^1.8.4
  ricmoo/QRCode@^0.0.1

; One env per app. build_src_filter is relative to src_dir (= apps/).
;   pio run -e hello -t upload -t monitor
;   ./push-config ticker        # config.json + logos, no rebuild
; The base OS. Lives in `factory`; every other env uploads to ota_0 by itself
; because the platform prefers that partition when the table has one, which is
; why only this env needs the offset override.
[env:home]
build_src_filter = -<*> +<home/>
extra_scripts = ${env.extra_scripts}
  post:scripts/home_offset.py

[env:hello]
build_src_filter = -<*> +<hello/>

[env:ticker]
build_src_filter = -<*> +<ticker/>
; The price snapshot that survives deep sleep: RtcRow[40] plus three
; scalars. static_assert in main.cpp fails the build if it outgrows this.
build_flags = ${env.build_flags} -D RTC_SNAPSHOT_BYTES=3456

[env:sports]
build_src_filter = -<*> +<sports/>
build_flags = ${env.build_flags} -D LCD_BOUNCE_LINES=40

[env:social]
build_src_filter = -<*> +<social/>
build_flags = ${env.build_flags} -D LCD_BOUNCE_LINES=40

[env:unifi]
build_src_filter = -<*> +<unifi/>
