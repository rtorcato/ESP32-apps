<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="modbus-readout: device table with live register values, a throughput chart and a timed-out slave">
  <!-- 800x480 native (1:1). Register map comes from a config file, not code. -->
  <rect width="800" height="480" fill="#0b0f14"/>

  <rect width="800" height="44" fill="#161d26"/>
  <circle cx="20" cy="22" r="5" fill="#3fb950"/>
  <text x="36" y="27" font-family="monospace" font-size="13" fill="#e6edf3">RS485 &#183; 9600 8N1 &#183; 4 slaves</text>
  <text x="784" y="27" font-family="monospace" font-size="13" fill="#8b98a5" text-anchor="end">poll 1.0s</text>

  <!-- ── headline: house power ───────────────────────────────── -->
  <rect x="16" y="60" width="380" height="150" rx="6" fill="#12171e"/>
  <text x="36" y="86" font-family="monospace" font-size="12" fill="#6e7681">MAINS &#183; slave 1 &#183; DDS238</text>
  <text x="36" y="146" font-family="monospace" font-size="48" fill="#d29922">1.842</text>
  <text x="220" y="146" font-family="monospace" font-size="18" fill="#8b98a5">kW</text>
  <g font-family="monospace" font-size="12">
    <text x="36" y="176" fill="#6e7681">V 121.4</text>
    <text x="150" y="176" fill="#6e7681">A 15.2</text>
    <text x="256" y="176" fill="#6e7681">pf 0.97</text>
    <text x="36" y="196" fill="#6e7681">today 14.6 kWh</text>
    <text x="220" y="196" fill="#6e7681">total 8412 kWh</text>
  </g>

  <!-- ── chart ───────────────────────────────────────────────── -->
  <rect x="412" y="60" width="372" height="150" rx="6" fill="#12171e"/>
  <text x="432" y="86" font-family="monospace" font-size="12" fill="#6e7681">kW &#183; 1h</text>
  <text x="768" y="86" font-family="monospace" font-size="11" fill="#4d5560" text-anchor="end">history &#8594; SD</text>
  <polyline fill="none" stroke="#d29922" stroke-width="2"
    points="432,190 456,186 480,172 504,178 528,140 552,132 576,150 600,146 624,118
            648,126 672,158 696,166 720,152 744,178 768,170"/>
  <line x1="432" y1="196" x2="768" y2="196" stroke="#263140"/>

  <!-- ── device table ────────────────────────────────────────── -->
  <rect x="16" y="226" width="768" height="196" rx="6" fill="#12171e"/>
  <g font-family="monospace" font-size="11" fill="#6e7681">
    <text x="36" y="250">SLV</text><text x="92" y="250">DEVICE</text><text x="300" y="250">REGISTER</text>
    <text x="470" y="250">TYPE</text><text x="600" y="250">VALUE</text><text x="768" y="250" text-anchor="end">AGE</text>
  </g>
  <line x1="36" y1="258" x2="768" y2="258" stroke="#263140"/>

  <g font-family="monospace" font-size="13">
    <text x="36" y="282" fill="#8b98a5">1</text><text x="92" y="282" fill="#e6edf3">DDS238 meter</text>
    <text x="300" y="282" fill="#8b98a5">0x0008</text><text x="470" y="282" fill="#6e7681">u32 /100</text>
    <text x="600" y="282" fill="#e6edf3">1842 W</text><text x="768" y="282" fill="#3fb950" text-anchor="end">0.4s</text>

    <text x="36" y="310" fill="#8b98a5">2</text><text x="92" y="310" fill="#e6edf3">XY-MD02 T/H</text>
    <text x="300" y="310" fill="#8b98a5">0x0001</text><text x="470" y="310" fill="#6e7681">i16 /10</text>
    <text x="600" y="310" fill="#e6edf3">21.4 &#176;C</text><text x="768" y="310" fill="#3fb950" text-anchor="end">0.6s</text>

    <text x="36" y="338" fill="#8b98a5">2</text><text x="92" y="338" fill="#e6edf3">XY-MD02 T/H</text>
    <text x="300" y="338" fill="#8b98a5">0x0002</text><text x="470" y="338" fill="#6e7681">u16 /10</text>
    <text x="600" y="338" fill="#e6edf3">44.1 %rh</text><text x="768" y="338" fill="#3fb950" text-anchor="end">0.6s</text>

    <!-- float32 with word-swap: the classic wrong-but-plausible failure -->
    <text x="36" y="366" fill="#8b98a5">3</text><text x="92" y="366" fill="#e6edf3">Inverter</text>
    <text x="300" y="366" fill="#8b98a5">0x3014</text><text x="470" y="366" fill="#d29922">f32 swap</text>
    <text x="600" y="366" fill="#e6edf3">412.8 V</text><text x="768" y="366" fill="#3fb950" text-anchor="end">0.9s</text>

    <!-- timed out: must not stall the loop for the others -->
    <text x="36" y="394" fill="#4d5560">4</text><text x="92" y="394" fill="#4d5560">VFD spindle</text>
    <text x="300" y="394" fill="#4d5560">0x2000</text><text x="470" y="394" fill="#4d5560">u16</text>
    <text x="600" y="394" fill="#f85149">timeout</text><text x="768" y="394" fill="#f85149" text-anchor="end">42s</text>
  </g>

  <text x="16" y="444" font-family="monospace" font-size="10" fill="#6e7681">register map from config file &#183; per-slave timeout, one dead slave never stalls the poll</text>
  <text x="16" y="464" font-family="monospace" font-size="10" fill="#d29922">mains measured by a DIN-rail meter over RS485 &#8212; board stays off the isolation barrier</text>
</svg>
