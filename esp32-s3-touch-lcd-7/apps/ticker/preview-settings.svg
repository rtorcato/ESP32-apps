<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="Ticker Tape SETTINGS: thirteen rows, label, value in grey, chevron; pickers and confirms open as sheets, the rest as pages">
  <!-- 800x480 native (1:1), drawn from the firmware's LAYOUTS[0] constants (2026-09-18). Rows from y=56 every 35, eleven on screen (Wi-Fi and Clear device scroll up). Scroll, Clock, Auto return, Sleep and Currency open a sheet over this page; Shutdown and Clear device a confirm sheet; Columns, News, Orientation, Theme and Info a page. -->
  <rect width="800" height="480" fill="#000000"/>
