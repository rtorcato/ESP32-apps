" stroke="#202020"/><text x="20" y="185" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#a6a6a6" text-anchor="start" >News</text><polyline points="771,170 779,178 771,186" fill="none" stroke="#a6a6a6" stroke-width="2" stroke-linejoin="round"/><line x1="20" y1="195.5" x2="780" y2="195.5" stroke="#202020"/><text x="20" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#a6a6a6" text-anchor="start" >Orientation</text><polyline points="771,205 779,213 771,221" fill="none" stroke="#a6a6a6" stroke-width="2" stroke-linejoin="round"/><text x="760" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#a6a6a6" text-anchor="end" >landscape</text><line x1="20" y1="230.5" x2="780" y2="230.5" stroke="#202020"/><text x="20" y="255" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#a6a6a6" text-anchor="start" >Clock</text><polyline points="771,240 779,248 771,256" fill="none" stroke="#a6a6a6" stroke-width="2" stroke-linejoin="round"/><text x="760" y="255" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#a6a6a6" text-anchor="end" >12-hour</text><line x1="20" y1="265.5" x2="780" y2="265.5" stroke="#202020"/><text x="20" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#a6a6a6" text-anchor="start" >Theme</text><polyline points="771,275 779,283 771,291" fill="none" stroke="#a6a6a6" stroke-width="2" stroke-linejoin="round"/><text x="760" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#a6a6a6" text-anchor="end" >black</text><line x1="20" y1="300.5" x2="780" y2="300.5" stroke="#202020"/><text x="20" y="325" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#a6a6a6" text-anchor="start" >Auto return</text><polyline points="771,310 779,318 771,326" fill="none" stroke="#a6a6a6" stroke-width="2" stroke-linejoin="round"/>