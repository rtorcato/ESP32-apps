<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="Ticker Tape NEWS: a magazine page of cards, picture left, headline, source and age; the next row's top shows under the two full rows">
  <!-- 800x480 native (1:1), drawn from the firmware's LAYOUTS[0] constants (2026-09-18). Cards 380x168 from (20,52), two across; the picture 140px (a 140x140 thumbnail from Yahoo's search endpoint, JPEG decoded on the board), the headline in the 14px face up to four lines, source and age under it. One row more than fits is cut at the page's edge. A drag scrolls a row; a tap on the lift opens the story's page with a QR code of its link. -->
  <rect width="800" height="480" fill="#000000"/>
