<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="obd2-gauge: three radial gauges, a live chart, secondary readouts and unsupported PIDs greyed out">
  <!-- 800x480 native (1:1). READ-ONLY: standard PID queries + passive listen.
       No frame injection into a live vehicle bus — see the README. -->
  <rect width="800" height="480" fill="#0b0f14"/>

  <!-- header -->
  <rect width="800" height="44" fill="#161d26"/>
  <circle cx="20" cy="22" r="5" fill="#3fb950"/>
  <text x="36" y="27" font-family="monospace" font-size="13" fill="#e6edf3">CAN 500k &#183; read-only</text>
  <text x="784" y="27" font-family="monospace" font-size="13" fill="#8b98a5" text-anchor="end">0 DTC</text>

  <!-- ── three radial gauges. r=76, 270° sweep (dasharray 358 of 477) ── -->
  <!-- coolant -->
  <circle cx="140" cy="176" r="76" fill="none" stroke="#1b232d" stroke-width="14"
          stroke-dasharray="358 119" stroke-linecap="round" transform="rotate(135 140 176)"/>
  <circle cx="140" cy="176" r="76" fill="none" stroke="#3fb950" stroke-width="14"
          stroke-dasharray="204 273" stroke-linecap="round" transform="rotate(135 140 176)"/>
  <text x="140" y="182" font-family="monospace" font-size="34" fill="#e6edf3" text-anchor="middle">88</text>
  <text x="140" y="204" font-family="monospace" font-size="11" fill="#6e7681" text-anchor="middle">COOLANT &#176;C</text>
  <text x="140" y="272" font-family="monospace" font-size="10" fill="#4d5560" text-anchor="middle">range 0&#8211;120 fixed</text>

  <!-- boost -->
  <circle cx="400" cy="176" r="76" fill="none" stroke="#1b232d" stroke-width="14"
          stroke-dasharray="358 119" stroke-linecap="round" transform="rotate(135 400 176)"/>
  <circle cx="400" cy="176" r="76" fill="none" stroke="#d29922" stroke-width="14"
          stroke-dasharray="140 337" stroke-linecap="round" transform="rotate(135 400 176)"/>
  <text x="400" y="182" font-family="monospace" font-size="34" fill="#e6edf3" text-anchor="middle">8.4</text>
  <text x="400" y="204" font-family="monospace" font-size="11" fill="#6e7681" text-anchor="middle">BOOST psi</text>
  <text x="400" y="272" font-family="monospace" font-size="10" fill="#4d5560" text-anchor="middle">peak 14.1</text>

  <!-- intake air temp -->
  <circle cx="660" cy="176" r="76" fill="none" stroke="#1b232d" stroke-width="14"
          stroke-dasharray="358 119" stroke-linecap="round" transform="rotate(135 660 176)"/>
  <circle cx="660" cy="176" r="76" fill="none" stroke="#58a6ff" stroke-width="14"
          stroke-dasharray="96 381" stroke-linecap="round" transform="rotate(135 660 176)"/>
  <text x="660" y="182" font-family="monospace" font-size="34" fill="#e6edf3" text-anchor="middle">31</text>
  <text x="660" y="204" font-family="monospace" font-size="11" fill="#6e7681" text-anchor="middle">INTAKE &#176;C</text>
  <text x="660" y="272" font-family="monospace" font-size="10" fill="#4d5560" text-anchor="middle">amb 22</text>

  <!-- ── live chart ──────────────────────────────────────────── -->
  <rect x="16" y="292" width="500" height="132" rx="6" fill="#12171e"/>
  <text x="32" y="314" font-family="monospace" font-size="11" fill="#6e7681">RPM &#183; 60s</text>
  <text x="500" y="314" font-family="monospace" font-size="11" fill="#8b98a5" text-anchor="end">2840</text>
  <polyline fill="none" stroke="#3fb950" stroke-width="2"
    points="32,404 62,398 92,376 122,352 152,368 182,340 212,318 242,346 272,330 302,352
            332,336 362,362 392,344 422,326 452,348 482,332 500,340"/>
  <line x1="32" y1="412" x2="500" y2="412" stroke="#263140"/>

  <!-- ── secondary readouts + unsupported PIDs ───────────────── -->
  <rect x="532" y="292" width="252" height="132" rx="6" fill="#12171e"/>
  <g font-family="monospace" font-size="12">
    <text x="548" y="316" fill="#6e7681">SPEED</text>     <text x="768" y="316" fill="#e6edf3" text-anchor="end">78 km/h</text>
    <text x="548" y="340" fill="#6e7681">TIMING</text>    <text x="768" y="340" fill="#e6edf3" text-anchor="end">+14.5&#176;</text>
    <text x="548" y="364" fill="#6e7681">S-T TRIM</text>  <text x="768" y="364" fill="#3fb950" text-anchor="end">-1.6%</text>
    <text x="548" y="388" fill="#6e7681">L-T TRIM</text>  <text x="768" y="388" fill="#d29922" text-anchor="end">+6.2%</text>
    <!-- greyed: car does not report this PID. Never show a zero instead. -->
    <text x="548" y="412" fill="#31383f">OIL TEMP</text>  <text x="768" y="412" fill="#31383f" text-anchor="end">n/a</text>
  </g>

  <text x="16" y="446" font-family="monospace" font-size="10" fill="#6e7681">PIDs from mode 01 bitmask &#183; unsupported greyed, never zeroed</text>
  <text x="784" y="446" font-family="monospace" font-size="10" fill="#d29922" text-anchor="end">sleeps on bus idle</text>
  <text x="16" y="466" font-family="monospace" font-size="10" fill="#4d5560">bench/diagnostic tool &#183; not a permanent install</text>
</svg>
