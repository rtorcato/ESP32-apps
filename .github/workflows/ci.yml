# Compiles every app that has source. This is the required status check on
# main: it is the thing that catches a lib/ change breaking an app that was
# not the one being edited -- the whole reason the shared board/ui/appcfg
# headers are worth having.
name: CI

on:
  push:
    branches: [main]
    # A README, a preview SVG or a reference screenshot cannot break a
    # build, and a full run is ten minutes. Skipped only when *every*
    # changed file matches: touch one .cpp alongside the docs and it runs.
    # Safe to skip a required check here only because branch protection is
    # unavailable on this plan -- on a protected branch a skipped required
    # check blocks the merge forever.
    paths-ignore:
      - '**.md'
      - '**.svg'
      - '**.png'
      - '**.jpg'
      - 'LICENSE'
  pull_request:
    # Restated: GitHub Actions has no YAML anchors.
    paths-ignore:
      - '**.md'
      - '**.svg'
      - '**.png'
      - '**.jpg'
      - 'LICENSE'

# A force-push mid-build otherwise leaves the superseded run grinding through
# a ten-minute toolchain download for a commit nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per board so a failure names the board, and so four toolchains
  # build in parallel instead of fifteen envs in series.
  build:
    strategy:
      fail-fast: false
      matrix:
        board:
          - esp32-s3-touch-lcd-7
          - esp32-c6-lcd-1.47
          - esp32-2432s028r-cyd
          - elecrow-rotary-2.1
    name: build (${{ matrix.board }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The xtensa/riscv toolchains and the platform zip run to ~1GB and never
      # change between runs. Keyed per board: they do not all use the same one.
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ matrix.board }}-${{ hashFiles(format('{0}/platformio.ini', matrix.board)) }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.board }}-
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # secrets.h is gitignored, and the C6, CYD and rotary apps include it --
      # so a clean checkout of those three does not compile at all. The other
      # two symlink to the C6's copy, so one placeholder covers all three.
      # These are the example's fake credentials: CI proves the code builds,
      # it does not join anything.
      - name: Placeholder credentials
        run: cp esp32-c6-lcd-1.47/lib/board/secrets.h.example esp32-c6-lcd-1.47/lib/board/secrets.h

      # Every env in the board's platformio.ini, so a new app is covered the
      # moment it has one -- no list here to forget to update.
      - name: Build every app on this board
        run: pio run -d ${{ matrix.board }}
