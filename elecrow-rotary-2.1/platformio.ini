; Elecrow CrowPanel 2.1" HMI ESP32-S3 Rotary Display -- 480x480 round ST7701,
; capacitive touch, detented encoder with push. Module is an ESP32-S3 N16R8:
; 16MB quad flash, 8MB octal PSRAM (esptool: "Embedded PSRAM 8MB (AP_3v3)").
;
; Same pioarduino fork as the C6 project so both boards build on one Arduino
; core version. The S3 would also work on the official platform; sharing the
; fork is about not debugging two cores.
[platformio]
src_dir = apps

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; The n16r8 manifest is what sets memory_type = qio_opi and BOARD_HAS_PSRAM.
; The plain esp32-s3-devkitc-1 manifest assumes 8MB and no PSRAM, and the
; 460KB framebuffer for a 480x480 RGB panel has nowhere to live without PSRAM.
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; default_16MB.csv: two 6.5MB OTA app slots and a 3.4MB data partition. Nothing
; here is near either limit, so no huge_app dance like the 4MB C6.
board_build.filesystem = littlefs

; ponytail: the config loader, the data-dir hook and push-config are the C6
; project's, reached by symlink / relative path rather than copied. Hoist them
; to the repo root when a third board needs them.
extra_scripts = pre:../esp32-c6-lcd-1.47/scripts/appdata.py

; Native USB CDC, as on the C6: without this Serial goes to the UART pins.
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

lib_deps =
  moononournation/GFX Library for Arduino@^1.6.7
  bblanchon/ArduinoJson@^7.0.0

; One env per app. build_src_filter is relative to src_dir (= apps/).
;   pio run -e hello -t upload -t monitor
;   ./push-config hello        # config.json only, no rebuild
[env:hello]
build_src_filter = -<*> +<hello/>
