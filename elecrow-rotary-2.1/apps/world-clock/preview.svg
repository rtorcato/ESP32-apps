<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="world clock: a globe turned to face Tokyo with the night side dark, the city name, large blue night-time digits, seconds, date, UTC offset, the current weather, and a ring of zone dots">
  <!-- 480x480 round. The globe is the firmware's own render: the same land
       mask (src/landmask.h), projection and terminator maths as src/globe.h,
       run on the host by the script that wrote this file, at 2026-09-16
       03:41 JST facing Tokyo with tilt 30. Text boxes mirror src/main.cpp:
       built-in font is 6*size x 8*size per glyph. -->
  <defs><clipPath id="round"><circle cx="240" cy="240" r="240"/></clipPath></defs>
  <rect width="480" height="480" fill="#000"/>
  <g clip-path="url(#round)">
    <image x="0" y="0" width="480" height="480" xlink:href="data:image/png;base64,"/>
    <!-- ring at r=222, DARKGREY; a dot per zone at 15 degrees per hour of offset from the selected one -->
    <circle cx="240" cy="240" r="222" fill="none" stroke="#7b7d7b" stroke-width="1"/>
    <circle cx="240" cy="18" r="9" fill="#ff0"/>
    <circle cx="26" cy="291" r="6" fill="#0ff"/>
    <circle cx="86" cy="86" r="6" fill="#7b7d7b"/>
    <circle cx="18" cy="240" r="6" fill="#7b7d7b"/>
    <circle cx="26" cy="189" r="6" fill="#7b7d7b"/>
    <circle cx="67" cy="107" r="6" fill="#7b7d7b"/>
    <circle cx="124" cy="45" r="6" fill="#7b7d7b"/>
    <circle cx="351" cy="48" r="6" fill="#7b7d7b"/>
    <!-- city dots on the globe: selected yellow, home cyan, others light grey, each on a black halo -->
    <circle cx="395" cy="73" r="5" fill="#000"/><circle cx="395" cy="73" r="3" fill="#c6c6c6"/><circle cx="25" cy="162" r="5" fill="#000"/><circle cx="25" cy="162" r="3" fill="#c6c6c6"/><circle cx="32" cy="217" r="5" fill="#000"/><circle cx="32" cy="217" r="3" fill="#c6c6c6"/><circle cx="240" cy="216" r="7" fill="#000"/><circle cx="240" cy="216" r="5" fill="#ff0"/><circle cx="280" cy="453" r="5" fill="#000"/><circle cx="280" cy="453" r="3" fill="#c6c6c6"/>
    <!-- size 4 = 24x32, 12 chars centred: the city -->
    <text x="240" y="112" font-family="monospace" font-size="32" fill="#ff0" text-anchor="middle">TOKYO</text>
    <!-- size 8 = 48x64: the time. Cool blue = night in that zone -->
    <text x="240" y="216" font-family="monospace" font-size="64" fill="#7896ff" text-anchor="middle" textLength="240" lengthAdjust="spacing">03:41</text>
    <!-- size 3 = 18x24: seconds -->
    <text x="222" y="257" font-family="monospace" font-size="24" fill="#7b7d7b" textLength="36" lengthAdjust="spacing">17</text>
    <!-- size 3, 10 chars: date -->
    <text x="240" y="305" font-family="monospace" font-size="24" fill="#c6c6c6" text-anchor="middle">Wed 16 Sep</text>
    <!-- size 2 = 12x16, 22 chars: offset line -->
    <text x="240" y="350" font-family="monospace" font-size="16" fill="#c6c6c6" text-anchor="middle">UTC+9  HOME+13h</text>
    <!-- size 3, 16 chars: open-meteo current conditions for the city -->
    <text x="240" y="393" font-family="monospace" font-size="24" fill="#fff" text-anchor="middle">17C clear</text>
  </g>
</svg>
